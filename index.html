<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .question {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            color: #333;
            position: relative;
            overflow: hidden;
        }

        .option:hover:not(.disabled) {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .option::before {
            content: attr(data-label);
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            text-align: center;
            line-height: 28px;
            margin-right: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        .option.correct::before {
            background: #28a745;
            content: '✓';
        }

        .option.incorrect::before {
            background: #dc3545;
            content: '✗';
        }

        .feedback {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            animation: fadeIn 0.3s ease-out;
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .question {
                font-size: 18px;
            }

            .option {
                padding: 14px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>🎯 Quick Quiz</h1>
        <p class="subtitle">Test your knowledge!</p>
        
        <div class="question" id="question"></div>
        
        <div class="options" id="options"></div>
        
        <div class="feedback" id="feedback"></div>
        
        <button class="btn" id="nextBtn" style="display: none;">Next Question</button>
    </div>

    <script>
        // YOUR QUIZ QUESTIONS - Edit this array with your questions!
        const quizQuestions = [
            {
                question: "Which country has the most AI unicorns?",
                options: ["United Kingdom", "China", "USA", "India"],
                correct: 2,
                explanation: "The USA leads in AI unicorns (startups valued over $1 billion) due to its strong venture capital ecosystem and tech hubs like Silicon Valley."
            },
            {
                question: "What is the most popular framework that allows agents to use tools?",
                options: ["TensorFlow", "Langchain", "PyTorch", "Hugging Face"],
                correct: 1,
                explanation: "Langchain is specifically designed to enable AI agents to interact with external tools and data sources, making it the go-to framework for building agent-based applications."
            },
            {
                question: "What's the name of the test that determines if a machine can exhibit human-like intelligence?",
                options: ["Turing Test", "Intelligence Quotient Test", "Cognitive Assessment Test", "Machine Learning Test"],
                correct: 0,
                explanation: "Proposed by Alan Turing in 1950, the Turing Test evaluates a machine's ability to exhibit intelligent behavior indistinguishable from a human."
            },
            {
                question: "What's the term for when AI makes decisions we can't easily explain?",
                options: ["Mystery Mode", "Black Box Problem", "Hidden Algorithm", "Secret Processing"],
                correct: 1,
                explanation: "The Black Box Problem refers to AI systems (especially deep neural networks) that make accurate predictions but whose internal decision-making process is opaque and difficult to interpret."
            },
            {
                question: "What's the term for AI that can perform any intellectual task a human can do?",
                options: ["Narrow AI", "Artificial General Intelligence (AGI)", "Super AI", "Machine Learning"],
                correct: 1,
                explanation: "AGI refers to hypothetical AI systems with human-level intelligence across all domains, unlike current 'narrow AI' which excels only at specific tasks."
            },
            {
                question: "What revolutionary AI paper published in 2017 introduced the Transformer architecture?",
                options: ["Deep Learning Revolution", "Attention is All You Need", "Neural Networks Unleashed", "The Future of AI"],
                correct: 1,
                explanation: "This groundbreaking paper by Google researchers introduced the Transformer architecture, which became the foundation for modern large language models like GPT and BERT."
            },
            {
                question: "Which country has the most AI patents?",
                options: ["USA", "Japan", "China", "South Korea"],
                correct: 2,
                explanation: "China has filed the most AI-related patents globally, reflecting its massive investment in AI research and development as part of its national strategy."
            },
            {
                question: "In what year did Deep Blue defeat world chess champion Garry Kasparov?",
                options: ["1995", "1997", "1999", "2001"],
                correct: 1,
                explanation: "IBM's Deep Blue made history by defeating reigning world champion Garry Kasparov in a six-game match, marking a milestone in AI's ability to compete with human expertise."
            },
            {
                question: "What is the name of Meta's (Facebook's) open-source large language model?",
                options: ["GPT", "BERT", "LLaMA", "Claude"],
                correct: 2,
                explanation: "LLaMA (Large Language Model Meta AI) is Meta's open-source language model released to researchers, designed to democratize access to large language model technology."
            },
            {
                question: "In the video game 'Portal,' what is the name of the AI antagonist?",
                options: ["HAL 9000", "Cortana", "GLaDOS", "SHODAN"],
                correct: 2,
                explanation: "GLaDOS (Genetic Lifeform and Disk Operating System) is the sarcastic AI villain in Portal, known for her dark humor and memorable personality in gaming culture."
            }
        ];

        // App state
        let currentQuestion = null;
        let answered = false;

        // Get random question
        function getRandomQuestion() {
            const randomIndex = Math.floor(Math.random() * quizQuestions.length);
            return quizQuestions[randomIndex];
        }

        // Display question
        function displayQuestion() {
            currentQuestion = getRandomQuestion();
            answered = false;

            document.getElementById('question').textContent = currentQuestion.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            currentQuestion.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.dataset.label = labels[index];
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // Handle option selection
        function selectOption(selectedIndex) {
            if (answered) return;
            
            answered = true;
            const options = document.querySelectorAll('.option');
            const feedbackDiv = document.getElementById('feedback');
            const isCorrect = selectedIndex === currentQuestion.correct;

            options.forEach((option, index) => {
                option.classList.add('disabled');
                
                if (index === currentQuestion.correct) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && !isCorrect) {
                    option.classList.add('incorrect');
                }
            });

            if (isCorrect) {
                feedbackDiv.className = 'feedback correct show';
                feedbackDiv.innerHTML = `<strong>✓ Correct!</strong><br>${currentQuestion.explanation}`;
            } else {
                feedbackDiv.className = 'feedback incorrect show';
                feedbackDiv.innerHTML = `<strong>✗ Incorrect!</strong><br>${currentQuestion.explanation}`;
            }

            document.getElementById('nextBtn').style.display = 'block';
        }

        // Next question
        document.getElementById('nextBtn').onclick = () => {
            displayQuestion();
        };

        // Initialize quiz
        displayQuestion();
    </script>
</body>
</html>
